<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="셔클 공공교통 플랫폼 도입 컨설팅 문의">
  <title>셔클 | 지역 맞춤형 공공교통 도입 컨설팅</title>
  <style>
    :root { --navy:#071b34; --navy-deep:#041326; --blue:#2462f7; --mint:#8cffc0; --ink:#15213b; --muted:#56667d; --line:#c8d8eb; --paper:#fff; }
    * { box-sizing:border-box; }
    html { background:var(--navy-deep); }
    body { min-width:320px; margin:0; color:var(--ink); font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all; }
    ::selection { color:var(--navy); background:var(--mint); }
    .landing { position:relative; min-height:100svh; overflow:hidden; color:#fff; background:linear-gradient(136deg,#05162e 0%,#082b56 54%,#195690 100%); }
    .landing::before { content:""; position:absolute; top:-28vw; right:-20vw; width:min(84vw,980px); aspect-ratio:1; border:1px solid rgba(150,205,255,.22); border-radius:50%; pointer-events:none; }
    .landing::after { content:""; position:absolute; right:-12vw; bottom:-29vw; width:min(70vw,780px); aspect-ratio:1; border:1px solid rgba(140,255,192,.3); border-radius:50%; pointer-events:none; }
    .shell { position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(390px,.86fr); gap:clamp(42px,7vw,126px); width:min(1180px,calc(100% - 48px)); min-height:100svh; margin:0 auto; padding:clamp(36px,7vw,84px) 0; align-items:center; }
    .brand { display:inline-flex; width:36px; line-height:0; }
    .brand img { width:100%; height:auto; }
    h1,p { margin:0; }
    h1 { max-width:620px; margin-top:34px; font-size:clamp(40px,5vw,68px); line-height:1.15; letter-spacing:-.055em; }
    h1 em { color:var(--mint); font-style:normal; }
    .lead { max-width:550px; margin-top:24px; color:#d7e5f6; font-size:clamp(16px,1.55vw,20px); line-height:1.7; letter-spacing:-.025em; }
    .details { display:flex; flex-wrap:wrap; gap:10px; margin-top:36px; }
    .details a { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:11px 17px; border:1px solid rgba(216,234,255,.4); border-radius:12px; color:#fff; background:rgba(255,255,255,.06); font-size:14px; font-weight:800; text-decoration:none; transition:transform .18s ease,background .18s ease,border-color .18s ease; }
    .details a:hover { transform:translateY(-2px); border-color:var(--mint); background:rgba(140,255,192,.12); }
    .details a:focus-visible,.submit:focus-visible,.interest-option:focus-within { outline:3px solid var(--mint); outline-offset:3px; }
    .detail-arrow { margin-left:8px; font-size:18px; line-height:1; }
    .form-panel { padding:clamp(22px,3vw,34px); border:1px solid rgba(201,223,249,.45); border-radius:18px; background:rgba(5,24,51,.6); box-shadow:0 22px 48px rgba(0,12,31,.22); backdrop-filter:blur(14px); }
    .form-panel h2 { margin:0; color:#fff; font-size:24px; letter-spacing:-.04em; }
    .form-panel > p { margin-top:8px; color:#d5e3f6; font-size:14px; line-height:1.55; }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px; }
    .field { min-width:0; }
    .field label,.interest-legend { display:block; margin:0 0 6px; color:#ecf5ff; font-size:13px; font-weight:800; }
    .field input { width:100%; min-height:45px; padding:10px 12px; border:1px solid rgba(205,225,249,.36); border-radius:10px; outline:none; color:#fff; background:rgba(255,255,255,.09); font:inherit; font-size:15px; transition:border-color .18s ease,background .18s ease,box-shadow .18s ease; }
    .field input::placeholder { color:#b9c8da; opacity:1; }
    .field input:focus { border-color:var(--mint); background:rgba(255,255,255,.14); box-shadow:0 0 0 3px rgba(140,255,192,.16); }
    fieldset { min-width:0; margin:22px 0 0; padding:0; border:0; }
    .interest-hint { margin:0 0 10px; color:#bbcae0; font-size:12px; line-height:1.45; }
    .interest-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .interest-option { position:relative; display:flex; gap:9px; align-items:center; min-height:44px; padding:10px 11px; border:1px solid rgba(205,225,249,.3); border-radius:10px; color:#dce9fc; background:rgba(255,255,255,.055); font-size:13px; font-weight:700; cursor:pointer; transition:border-color .18s ease,background .18s ease,color .18s ease; }
    .interest-option:hover { border-color:rgba(140,255,192,.75); }
    .interest-option:has(input:checked) { border-color:var(--mint); color:#fff; background:rgba(140,255,192,.14); }
    .interest-option input { position:absolute; width:1px; height:1px; opacity:0; }
    .checkmark { display:grid; flex:0 0 auto; width:18px; height:18px; place-items:center; border:1px solid #afc5e2; border-radius:5px; color:transparent; font-size:13px; line-height:1; }
    .interest-option input:checked + .checkmark { border-color:var(--mint); color:var(--navy); background:var(--mint); }
    .submit-row { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:22px; }
    .submit-note { color:#c5d5e9; font-size:12px; line-height:1.5; }
    .submit { flex:0 0 auto; min-height:46px; padding:11px 18px; border:0; border-radius:10px; color:var(--navy); background:var(--mint); font:800 14px/1 Pretendard,"Noto Sans KR",sans-serif; cursor:pointer; transition:transform .18s ease,background .18s ease; }
    .submit:hover { background:#b0ffd2; transform:translateY(-1px); }
    .submit:disabled { cursor:wait; opacity:.72; transform:none; }
    .form-status { margin-top:16px; padding:12px 13px; border-radius:10px; color:#dce9fc; background:rgba(255,255,255,.08); font-size:13px; font-weight:700; line-height:1.5; }
    .form-status.success { color:#dfffee; background:rgba(0,184,107,.2); }
    .form-status.error { color:#ffe0df; background:rgba(233,79,95,.19); }
    .form-status[hidden] { display:none; }
    .footer-note { position:absolute; z-index:1; bottom:24px; left:50%; width:min(1180px,calc(100% - 48px)); transform:translateX(-50%); color:#b8cae1; font-size:12px; }
    @media (max-width:900px) { .shell { grid-template-columns:1fr; width:min(620px,calc(100% - 40px)); padding:38px 0 74px; } .intro { text-align:center; } .brand { margin:auto; } h1 { margin-right:auto; margin-left:auto; } .lead { margin-right:auto; margin-left:auto; } .details { justify-content:center; } .footer-note { width:calc(100% - 40px); text-align:center; } }
    @media (max-width:640px) { .shell { width:calc(100% - 32px); gap:34px; } h1 { margin-top:27px; font-size:34px; } .lead { font-size:16px; } .details { display:grid; grid-template-columns:1fr; } .details a { width:100%; } .form-panel { padding:20px 16px; border-radius:15px; } .field-grid,.interest-grid { grid-template-columns:1fr; } .submit-row { align-items:stretch; flex-direction:column; } .submit { width:100%; } }
  </style>
</head>
<body>
  <main class="landing">
    <div class="shell">
      <section class="intro" aria-labelledby="landing-title">
        <div class="brand"><img src="./assets/symbol_white.svg" alt="셔클"></div>
        <h1 id="landing-title">지역 맞춤형<br><em>공공교통</em> 도입 컨설팅</h1>
        <p class="lead">셔클 플랫폼은 지역 주민의 이동을 지원합니다.<br>맞춤 컨설팅을 통해 지역별 특화 솔루션을 제안하고,<br>지역 교통 정책의 실현을 돕습니다.</p>
        <nav class="details" aria-label="서비스 상세 자료">
          <a href="./details.html?service=publicTaxi">공공형택시 자세히 알아보기 <span class="detail-arrow" aria-hidden="true">→</span></a>
          <a href="./details.html?service=drt">택시형 DRT 자세히 알아보기 <span class="detail-arrow" aria-hidden="true">→</span></a>
        </nav>
      </section>
      <section class="form-panel" aria-labelledby="inquiry-title">
        <h2 id="inquiry-title">도입 상담 문의</h2>
        <p>정보를 남겨 주시면 담당자가 지역 여건에 맞는 상담을 준비합니다.</p>
        <form id="inquiry-form" novalidate>
          <div class="field-grid">
            <div class="field"><label for="organization">소속기관</label><input id="organization" name="소속기관" autocomplete="organization" placeholder="예: ○○군청" required></div>
            <div class="field"><label for="name">이름</label><input id="name" name="이름" autocomplete="name" placeholder="이름을 입력해 주세요" required></div>
            <div class="field"><label for="phone">연락처</label><input id="phone" name="연락처" type="tel" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000" required></div>
            <div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
          </div>
          <fieldset>
            <legend class="interest-legend">관심 있는 서비스</legend>
            <p class="interest-hint">여러 서비스를 선택할 수 있습니다.</p>
            <div class="interest-grid">
              <label class="interest-option"><input type="checkbox" name="관심 서비스" value="버스형DRT"><span class="checkmark" aria-hidden="true">✓</span>버스형DRT</label>
              <label class="interest-option"><input type="checkbox" name="관심 서비스" value="택시형DRT"><span class="checkmark" aria-hidden="true">✓</span>택시형DRT</label>
              <label class="interest-option"><input type="checkbox" name="관심 서비스" value="공공형택시"><span class="checkmark" aria-hidden="true">✓</span>공공형택시</label>
              <label class="interest-option"><input type="checkbox" name="관심 서비스" value="AI기반 수요예측 시뮬레이션"><span class="checkmark" aria-hidden="true">✓</span>AI기반 수요예측 시뮬레이션</label>
            </div>
          </fieldset>
          <div class="submit-row"><span class="submit-note">입력하신 정보는 상담 문의 접수를 위해 전달됩니다.</span><button class="submit" type="submit">문의 남기기</button></div>
          <div id="form-status" class="form-status" role="status" aria-live="polite" hidden></div>
        </form>
      </section>
    </div>
    <p class="footer-note">Shucle Public Mobility Platform</p>
  </main>
  <script>
    (() => {
      const form = document.querySelector('#inquiry-form');
      const status = document.querySelector('#form-status');
      const submit = form.querySelector('.submit');
      const endpoint = 'https://formsubmit.co/ajax/yudamchoi@hyundai.com';
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const data = new FormData(form);
        const interests = [...form.querySelectorAll('input[name="관심 서비스"]:checked')].map((input) => input.value);
        data.delete('관심 서비스');
        data.append('관심 서비스', interests.length ? interests.join(', ') : '선택 안 함');
        data.append('_subject', '[셔클] 공공교통 도입 상담 문의');
        data.append('_template', 'table');
        submit.disabled = true;
        submit.textContent = '접수 중';
        status.hidden = true;
        try {
          const response = await fetch(endpoint, { method:'POST', headers:{ Accept:'application/json' }, body:data });
          if (!response.ok) throw new Error('submission failed');
          form.reset();
          status.className = 'form-status success';
          status.textContent = '문의가 접수되었습니다. 현대자동차 모빌리티사업추진팀에서 연락드릴 예정입니다.';
          status.hidden = false;
        } catch (error) {
          status.className = 'form-status error';
          status.textContent = '문의 접수에 실패했습니다. 잠시 후 다시 시도해 주세요.';
          status.hidden = false;
        } finally {
          submit.disabled = false;
          submit.textContent = '문의 남기기';
        }
      });
    })();
  </script>
</body>
</html>
