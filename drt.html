<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="셔클 공공교통 플랫폼 도입 컨설팅 문의">
  <title>셔클 | 지역 맞춤형 공공교통 도입 컨설팅</title>
  <style>
    :root { --navy:#071b34; --navy-deep:#041326; --blue:#2462f7; --mint:#8cffc0; --ink:#15213b; --muted:#56667d; --line:#c8d8eb; --paper:#fff; }
    * { box-sizing:border-box; }
    html { background:var(--navy-deep); }
    body { min-width:320px; margin:0; color:var(--ink); font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all; }
    ::selection { color:var(--navy); background:var(--mint); }
    .landing { position:relative; min-height:100svh; overflow:hidden; color:#fff; background:linear-gradient(136deg,#05162e 0%,#082b56 54%,#195690 100%); }
    .landing::before { content:""; position:absolute; top:-28vw; right:-20vw; width:min(84vw,980px); aspect-ratio:1; border:1px solid rgba(150,205,255,.22); border-radius:50%; pointer-events:none; }
    .landing::after { content:""; position:absolute; right:-12vw; bottom:-29vw; width:min(70vw,780px); aspect-ratio:1; border:1px solid rgba(140,255,192,.3); border-radius:50%; pointer-events:none; }
    .shell { position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(390px,.86fr); gap:clamp(42px,7vw,126px); width:min(1180px,calc(100% - 48px)); min-height:100svh; margin:0 auto; padding:clamp(36px,7vw,84px) 0; align-items:center; }
    .brand { display:inline-flex; width:36px; line-height:0; }
    .brand img { width:100%; height:auto; }
    h1,p { margin:0; }
    h1 { max-width:620px; margin-top:34px; font-size:clamp(40px,5vw,68px); line-height:1.15; letter-spacing:-.055em; }
    h1 em { color:var(--mint); font-style:normal; }
    .lead { max-width:550px; margin-top:24px; color:#d7e5f6; font-size:clamp(16px,1.55vw,20px); line-height:1.7; letter-spacing:-.025em; }
    .details { display:flex; flex-wrap:wrap; gap:10px; margin-top:36px; }
    .details a { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:11px 17px; border:1px solid rgba(216,234,255,.4); border-radius:12px; color:#fff; background:rgba(255,255,255,.06); font-size:14px; font-weight:800; text-decoration:none; transition:transform .18s ease,background .18s ease,border-color .18s ease; }
    .details a:hover { transform:translateY(-2px); border-color:var(--mint); background:rgba(140,255,192,.12); }
    .details a:focus-visible,.submit:focus-visible { outline:3px solid var(--mint); outline-offset:3px; }
    .detail-arrow { margin-left:8px; font-size:18px; line-height:1; }
    .form-panel { padding:0; }
    .form-panel h2 { margin:0; color:#fff; font-size:24px; letter-spacing:-.04em; }
    .form-panel > p { margin-top:8px; color:#d5e3f6; font-size:14px; line-height:1.55; }
    .form-frame { display:block; width:100%; min-height:700px; margin-top:18px; border:0; border-radius:14px; color:var(--ink); background:#fff; }
    .footer-note { position:absolute; z-index:1; bottom:24px; left:50%; width:min(1180px,calc(100% - 48px)); transform:translateX(-50%); color:#b8cae1; font-size:12px; }
    @media (max-width:900px) { .shell { grid-template-columns:1fr; width:min(620px,calc(100% - 40px)); padding:38px 0 74px; } .intro { text-align:center; } .brand { margin:auto; } h1 { margin-right:auto; margin-left:auto; } .lead { margin-right:auto; margin-left:auto; } .details { justify-content:center; } .footer-note { width:calc(100% - 40px); text-align:center; } }
    @media (max-width:640px) { .shell { width:calc(100% - 32px); gap:34px; } h1 { margin-top:27px; font-size:34px; } .lead { font-size:16px; } .details { display:grid; grid-template-columns:1fr; } .details a { width:100%; } .form-frame { min-height:760px; margin-top:18px; } }
  </style>
</head>
<body>
  <main class="landing">
    <div class="shell">
      <section class="intro" aria-labelledby="landing-title">
        <div class="brand"><img src="./assets/symbol_white.svg" alt="셔클"></div>
        <h1 id="landing-title">지역 맞춤형<br><em>공공교통</em> 도입 컨설팅</h1>
        <p class="lead">셔클 플랫폼은 지역 주민의 이동을 지원합니다.<br>맞춤 컨설팅을 통해 지역별 특화 솔루션을 제안하고,<br>지역 교통 정책의 실현을 돕습니다.</p>
        <nav class="details" aria-label="서비스 상세 자료">
          <a href="./details.html?service=publicTaxi">공공형택시 자세히 알아보기 <span class="detail-arrow" aria-hidden="true">→</span></a>
          <a href="./details.html?service=drt">택시형 DRT 자세히 알아보기 <span class="detail-arrow" aria-hidden="true">→</span></a>
        </nav>
      </section>
      <section class="form-panel" aria-labelledby="inquiry-title">
        <h2 id="inquiry-title">도입 상담 문의</h2>
        <p>아래 양식에서 정보를 남겨 주시면 담당자가 지역 여건에 맞는 상담을 준비합니다.</p>
        <iframe class="form-frame" title="셔클 공공교통 도입 상담 양식" src="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=8aVc-COqUkKoOkQ9Mzsf5wYQvZd07sZJiqVt-oHapi1UNjJZQVBUTU9JWUpYM09GT1RIQVQ4Q0c3OC4u&amp;embed=true" loading="lazy"><span style="color:#071b34">양식이 보이지 않으면 <a style="color:#071b34" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=8aVc-COqUkKoOkQ9Mzsf5wYQvZd07sZJiqVt-oHapi1UNjJZQVBUTU9JWUpYM09GT1RIQVQ4Q0c3OC4u" target="_blank" rel="noopener noreferrer">상담 양식 열기</a>를 선택해 주세요.</span></iframe>
      </section>
    </div>
    <p class="footer-note">Shucle Public Mobility Platform</p>
  </main>
</body>
</html>
